# Betrieb hinter einem Reverse-Proxy auf dem Host (so läuft der Produktionsserver:
# ein Caddy terminiert TLS für vsjourney.de und leitet an localhost:3000).
# Diese Datei in einen eigenen Ordner auf den Server kopieren:
#
#   echo 'IMAGE_TAG=1.0.0' > .env        # neben dieser Datei, siehe unten
#   docker compose -f docker-compose.yml pull
#   docker compose -f docker-compose.yml up -d
#
# IMAGE_TAG braucht Compose bei JEDEM Kommando (auch ps, logs, restart), nicht
# nur bei up: deshalb in die .env neben dieser Datei, nicht nur vor ein
# Kommando.
#
# Die App ist nur auf 127.0.0.1:3000 erreichbar, nicht aus dem Netz; TLS und
# Domain gehören dem Proxy. Die alte Seite belegt denselben Port: beim Umstieg
# vorher `docker compose down` in ihrem Ordner (siehe README). Für einen Server,
# auf dem Traefik selbst TLS terminiert, gibt es docker-compose.traefik.yml.
services:
  web:
    image: ghcr.io/kowrithv/saru_vinith_wedding:${IMAGE_TAG:?IMAGE_TAG in .env neben der Compose-Datei setzen, z. B. 1.0.0}
    container_name: saru-vinith-wedding
    restart: unless-stopped
    env_file:
      - .env.production
    ports:
      # Nur lokal: der Proxy auf dem Host greift hier zu, das Netz nicht.
      - "127.0.0.1:3000:3000"
    volumes:
      # Datenbank und Sicherungen (data/backups) - bleibt über Updates erhalten.
      - ./data:/app/data
    labels:
      # Nur relevant, wenn ein Autoheal-Container auf dem Server läuft.
      - "autoheal=true"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1500M
