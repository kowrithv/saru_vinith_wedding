name: CI

on:
  push:
    branches-ignore:
      - gh-pages
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GitHub Actions kann Tag-Pushes nicht nach Branch filtern (`tags:` und
  # `branches:` sind ODER-verknüpft). Deshalb prüft dieser Job bei Tags, ob
  # der getaggte Commit in main enthalten ist - sonst werden build und docker
  # übersprungen. Branch-Pushes, PRs und manuelle Läufe sind nicht betroffen.
  guard:
    name: Tag nur auf main
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.check.outputs.allowed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check that tag commit is on main
        id: check
        run: |
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          elif git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "allowed=true" >> "$GITHUB_OUTPUT"
          else
            echo "allowed=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Tag $GITHUB_REF_NAME liegt nicht auf main - Build übersprungen."
          fi

  build:
    name: Lint, Typecheck, Test & Build
    needs: guard
    if: needs.guard.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # `next build` selbst braucht diese aktuell nicht zwingend
          # (instrumentation.ts registriert sich erst bei echtem
          # Server-Start, nicht beim Prerendering) - gesetzt als
          # Vorsichtsmaßnahme, falls eine künftige Seite serverseitige
          # Daten beim Build abruft. Kein echtes Geheimnis - die echten
          # Werte kommen zur Laufzeit aus der Server-Umgebung
          # (docker-compose/.env.production).
          ADMIN_PASSWORD: ci-build-only
          GUEST_PASSWORD: ci-build-only
          R2_ACCOUNT_ID: ci-build-only
          R2_ACCESS_KEY_ID: ci-build-only
          R2_SECRET_ACCESS_KEY: ci-build-only
          R2_BUCKET_NAME: ci-build-only
          R2_PUBLIC_BASE_URL: https://ci-build-only.example.com

  docker:
    name: Build and push Docker image
    needs: build
    # Nur Versions-Tags (v*.*.*) erzeugen ein Package. Dass der Tag auf main
    # liegt, stellt der guard-Job sicher (build wird sonst übersprungen und
    # damit auch dieser Job).
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # latest=false ist Pflicht: clean-start/latest ist der Produktions-Tag
          # der ALTEN App und darf nie automatisch durch einen Versions-Tag
          # dieser neuen Pipeline verschoben werden (siehe Spec).
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
